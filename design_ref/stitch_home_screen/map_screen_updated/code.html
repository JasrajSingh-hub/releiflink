<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pin-shadow {
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        .map-gradient-overlay {
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0) 15%, rgba(255, 255, 255, 0) 85%, rgba(255, 255, 255, 0.9) 100%);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

<body class="bg-zinc-50 dark:bg-zinc-950 font-body text-zinc-900 dark:text-zinc-100 antialiased overflow-hidden h-screen">
<header class="fixed top-0 z-50 bg-white dark:bg-zinc-900 border-b-2 border-zinc-200 dark:border-zinc-800 flex justify-between items-center px-6 h-16 w-full">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-zinc-700 dark:text-zinc-300">emergency</span>
<h1 class="text-2xl font-black text-zinc-900 dark:text-white font-inter tracking-tight">ReliefLink</h1>
</div>
<div class="flex items-center gap-3">
<button class="flex items-center justify-center w-10 h-10 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-transform active:scale-95">
<span class="material-symbols-outlined text-zinc-700 dark:text-zinc-300">account_circle</span>
</button>
</div>
</header>
<main class="relative h-screen w-full pt-16 pb-24">
<div class="absolute inset-0 z-0">
<img class="w-full h-screen object-cover opacity-60 grayscale brightness-105" data-alt="High-contrast monochromatic light grey satellite view map of a dense urban city with clearly defined streets and blocks" data-location="San Francisco" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAHFCsQLJCa4R_bVX1m_HfUQfrVV6BiquHAwD5Za-LRFQ7CN2l29V1FtfCj8IdG-fvyi3fZ30wy56gndLBx044Es-8JKOZk1rge3IpjgY_c8MO8B9e6uGUI_XZc4xCQKynbWcAdeKT1X-tZU9e3POBIQxYWP6hSIWKzAKbDMyPhAOjPnU9VURdRqSyBVdJlIDqMFQIHn0KoeviXf7-5C3e_M0huQ8Tx0I45bO-fOnXIdOinA1UEtdMVfTKfDdI4ir3PzxhnOJKV"/>
<div class="absolute inset-0 map-gradient-overlay pointer-events-none"></div>
</div>
<div class="relative z-10 px-4 pt-4 flex flex-col gap-4">
<div class="flex items-center gap-2 bg-white/90 dark:bg-zinc-900/90 backdrop-blur-md rounded-lg p-2 border-2 border-zinc-200 dark:border-zinc-800 shadow-sm max-w-lg mx-auto w-full">
<div class="flex-1 flex items-center gap-3 px-3">
<span class="material-symbols-outlined text-zinc-400">search</span>
<input class="bg-transparent border-none focus:ring-0 text-sm w-full font-medium placeholder:text-zinc-400 text-zinc-900 dark:text-zinc-100" placeholder="Search locations..." type="text"/>
</div>
<button class="w-10 h-10 flex items-center justify-center bg-zinc-100 dark:bg-zinc-800 rounded-md hover:bg-zinc-200 dark:hover:bg-zinc-700 transition-colors">
<span class="material-symbols-outlined text-zinc-700 dark:text-zinc-300 text-[20px]">tune</span>
</button>
</div>
<div class="flex justify-center gap-2 overflow-x-auto pb-2 no-scrollbar">
<span class="bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 px-4 py-1.5 rounded-full text-xs font-bold tracking-wider uppercase flex items-center gap-1.5">
<span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>
                Live Signals
            </span>
<span class="bg-white dark:bg-zinc-900 text-zinc-600 dark:text-zinc-400 px-4 py-1.5 rounded-full text-xs font-bold tracking-wider uppercase border-2 border-zinc-200 dark:border-zinc-800">
                Shelters
            </span>
<span class="bg-white dark:bg-zinc-900 text-zinc-600 dark:text-zinc-400 px-4 py-1.5 rounded-full text-xs font-bold tracking-wider uppercase border-2 border-zinc-200 dark:border-zinc-800">
                Supplies
            </span>
</div>
</div>
<div class="absolute inset-0 z-0 pointer-events-none">
<!-- Red Priority Pin -->
<div class="absolute top-[35%] left-[25%] pointer-events-auto">
<div class="relative group cursor-pointer flex flex-col items-center">
<div class="bg-red-600 p-2.5 rounded-full text-white pin-shadow ring-4 ring-red-600/20 scale-110">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">emergency</span>
</div>
<div class="mt-2 bg-white dark:bg-zinc-900 p-3 rounded-lg shadow-xl border-2 border-zinc-200 dark:border-zinc-800 pointer-events-auto w-48 transition-all scale-100">
<p class="text-[10px] font-bold text-red-600 uppercase tracking-tighter mb-1">Critical Priority</p>
<h3 class="text-sm font-black text-zinc-900 dark:text-white leading-tight">Structural Collapse</h3>
<p class="text-[11px] text-zinc-500 mt-1 line-clamp-1">Sector 7G • 4 mins ago</p>
<button class="w-full mt-2.5 py-1.5 bg-red-600 text-white text-[10px] font-bold rounded-md uppercase tracking-wider hover:bg-red-700 transition-colors">
                        View Details
                    </button>
</div>
</div>
</div>
<!-- Yellow Priority Pin (Updated from Tertiary) -->
<div class="absolute top-[55%] right-[20%] pointer-events-auto">
<div class="relative group cursor-pointer flex flex-col items-center">
<div class="bg-amber-500 p-2.5 rounded-full text-white pin-shadow ring-4 ring-amber-500/20">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">water_drop</span>
</div>
</div>
</div>
<div class="absolute bottom-[35%] left-[45%] pointer-events-auto">
<div class="relative group cursor-pointer flex flex-col items-center">
<div class="bg-zinc-600 p-2.5 rounded-full text-white pin-shadow ring-4 ring-zinc-600/20">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">medical_services</span>
</div>
</div>
</div>
</div>
<div class="absolute bottom-32 right-6 z-20 flex flex-col gap-3">
<button class="w-12 h-12 flex items-center justify-center bg-white dark:bg-zinc-900 border-2 border-zinc-200 dark:border-zinc-800 rounded-lg shadow-sm text-zinc-700 dark:text-zinc-300 hover:bg-zinc-50 dark:hover:bg-zinc-800 transition-colors active:scale-95">
<span class="material-symbols-outlined">my_location</span>
</button>
<button class="w-12 h-12 flex items-center justify-center bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 rounded-lg shadow-lg active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add</span>
</button>
</div>

<a class="flex flex-col items-center justify-center text-zinc-600 dark:text-zinc-400 p-2 hover:text-zinc-900 dark:hover:text-white active:opacity-80 duration-100" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-inter text-xs font-bold uppercase mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-zinc-600 dark:text-zinc-400 p-2 hover:text-zinc-900 dark:hover:text-white active:opacity-80 duration-100" href="#">
<span class="material-symbols-outlined">format_list_bulleted</span>
<span class="font-inter text-xs font-bold uppercase mt-1">Requests</span>
</a>
<a class="flex flex-col items-center justify-center text-zinc-600 dark:text-zinc-400 p-2 hover:text-zinc-900 dark:hover:text-white active:opacity-80 duration-100" href="#">
<span class="material-symbols-outlined">add_circle</span>
<span class="font-inter text-xs font-bold uppercase mt-1">Create</span>
</a>
<a class="flex flex-col items-center justify-center bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 rounded-lg px-4 py-2 active:opacity-80 duration-100" href="#">
<span class="material-symbols-outlined">map</span>
<span class="font-inter text-xs font-bold uppercase mt-1">Map</span>
</a>
</nav>

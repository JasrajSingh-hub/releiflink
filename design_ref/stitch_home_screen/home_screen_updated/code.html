<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ReliefLink - Emergency Response</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary-container": "#fff2ed",
              "on-primary-fixed": "#410003",
              "inverse-on-surface": "#f1f1f1",
              "surface-tint": "#ba1a20",
              "on-secondary-container": "#217128",
              "tertiary": "#913f00",
              "tertiary-fixed": "#ffdbca",
              "surface-container-high": "#e8e8e8",
              "inverse-primary": "#ffb3ac",
              "inverse-surface": "#2f3131",
              "outline-variant": "#e4beba",
              "secondary": "#1b6d24",
              "on-surface": "#1a1c1c",
              "tertiary-container": "#b85100",
              "primary-fixed": "#ffdad6",
              "on-surface-variant": "#5b403d",
              "primary-container": "#d32f2f",
              "on-tertiary-fixed-variant": "#773200",
              "on-background": "#1a1c1c",
              "surface-bright": "#f9f9f9",
              "outline": "#8f6f6c",
              "on-secondary-fixed": "#002204",
              "error": "#ba1a1a",
              "primary": "#af101a",
              "surface-variant": "#e2e2e2",
              "background": "#ffffff",
              "on-primary-fixed-variant": "#930010",
              "on-tertiary-fixed": "#331200",
              "on-primary-container": "#fff2f0",
              "on-tertiary": "#ffffff",
              "primary-fixed-dim": "#ffb3ac",
              "on-secondary": "#ffffff",
              "surface-container-highest": "#e2e2e2",
              "on-error": "#ffffff",
              "surface-dim": "#dadada",
              "on-error-container": "#93000a",
              "surface": "#ffffff",
              "surface-container-lowest": "#ffffff",
              "on-primary": "#ffffff",
              "secondary-fixed": "#a3f69c",
              "tertiary-fixed-dim": "#ffb68f",
              "on-secondary-fixed-variant": "#005312",
              "surface-container": "#eeeeee",
              "secondary-container": "#a0f399",
              "secondary-fixed-dim": "#88d982",
              "surface-container-low": "#f3f3f3",
              "error-container": "#ffdad6"
            },
            fontFamily: {
              "headline": ["Inter", "sans-serif"],
              "body": ["Inter", "sans-serif"],
              "label": ["Inter", "sans-serif"]
            },
            borderRadius: {
              "DEFAULT": "0.5rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "2xl": "1rem",
              "3xl": "1.5rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            min-height: 100dvh;
        }
    </style>
</head>
<body class="bg-white text-zinc-900 font-body selection:bg-zinc-200 min-h-screen flex flex-col">
<!-- TopAppBar from COMPONENTS_9 -->
<header class="fixed top-0 w-full z-50 bg-white dark:bg-zinc-900 border-b-2 border-zinc-200 dark:border-zinc-800 flex justify-between items-center px-6 h-16 w-full">
<div class="flex items-center gap-4">
<button class="text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 active:scale-95 transition-transform p-2 rounded-lg">
<span class="material-symbols-outlined" data-icon="emergency">emergency</span>
</button>
<h1 class="text-2xl font-black text-zinc-900 dark:text-white tracking-tight uppercase">ReliefLink</h1>
</div>
<div class="flex items-center">
<button class="text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 active:scale-95 transition-transform p-2 rounded-lg">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-start px-6 pt-24 pb-32 max-w-lg mx-auto w-full">
<!-- Hero Editorial Section -->
<section class="w-full text-left mb-10">
<p class="text-[0.7rem] font-black uppercase tracking-widest text-zinc-500 mb-2">Operational Status: Active</p>
<h2 class="text-5xl font-black leading-[1] tracking-tighter text-zinc-900 mb-4">
            Decisive<br/>Action.
        </h2>
<p class="text-lg font-medium text-zinc-600 leading-relaxed">
            Get help or give help.
        </p>
</section>
<!-- Primary Actions -->
<div class="w-full space-y-4">
<!-- Request Help: High Urgency Red -->
<button class="group relative w-full h-56 rounded-2xl overflow-hidden bg-red-600 text-white shadow-xl shadow-red-200 active:scale-95 transition-transform duration-100 flex flex-col items-start justify-end p-8 text-left">
<div class="absolute top-6 right-6 opacity-20">
<span class="material-symbols-outlined !text-6xl" data-icon="emergency">emergency</span>
</div>
<span class="material-symbols-outlined mb-4 !text-4xl" data-icon="sos">sos</span>
<h3 class="text-2xl font-black tracking-tight uppercase">Request Help</h3>
<p class="text-white/80 font-bold text-xs uppercase tracking-wider mt-1">Immediate response needed</p>
</button>
<!-- Volunteer: Actionable/Clean style -->
<button class="group w-full h-40 rounded-2xl border-2 border-zinc-200 bg-zinc-50 hover:bg-zinc-100 text-zinc-900 active:scale-95 transition-transform duration-100 flex flex-col items-start justify-end p-8 text-left">
<div class="flex items-center gap-2 mb-2 text-zinc-500">
<span class="material-symbols-outlined text-sm" data-icon="volunteer_activism">volunteer_activism</span>
<span class="text-[0.65rem] font-black uppercase tracking-widest">Community Support</span>
</div>
<h3 class="text-xl font-bold tracking-tight">Volunteer</h3>
<p class="text-zinc-600 text-sm font-medium mt-1">Join the response effort</p>
</button>
</div>
<!-- Secondary Info Cards -->
<div class="grid grid-cols-2 gap-4 w-full mt-4">
<div class="bg-zinc-50 border border-zinc-100 p-5 rounded-2xl flex flex-col gap-3">
<span class="material-symbols-outlined text-zinc-400" data-icon="location_on">location_on</span>
<div>
<p class="text-[0.65rem] font-bold uppercase text-zinc-400">Your Zone</p>
<p class="font-black text-sm text-zinc-900">Sector 7-G</p>
</div>
</div>
<div class="bg-zinc-50 border border-zinc-100 p-5 rounded-2xl flex flex-col gap-3">
<span class="material-symbols-outlined text-zinc-400" data-icon="shield_with_heart">shield_with_heart</span>
<div>
<p class="text-[0.65rem] font-bold uppercase text-zinc-400">Verified</p>
<p class="font-black text-sm text-zinc-900">Safe Route</p>
</div>
</div>
</div>
</main>
<!-- BottomNavBar from COMPONENTS_9 -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-white dark:bg-zinc-900 border-t-2 border-zinc-200 dark:border-zinc-800 flex justify-around items-center px-4 pb-4 pt-2 shadow-lg">
<!-- Home Active -->
<a class="flex flex-col items-center justify-center bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 rounded-lg px-4 py-2 opacity-80 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-inter text-xs font-bold uppercase mt-1">Home</span>
</a>
<!-- Requests -->
<a class="flex flex-col items-center justify-center text-zinc-600 dark:text-zinc-400 p-2 hover:text-zinc-900 dark:hover:text-white opacity-80 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="format_list_bulleted">format_list_bulleted</span>
<span class="font-inter text-xs font-bold uppercase mt-1">Requests</span>
</a>
<!-- Create -->
<a class="flex flex-col items-center justify-center text-zinc-600 dark:text-zinc-400 p-2 hover:text-zinc-900 dark:hover:text-white opacity-80 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
<span class="font-inter text-xs font-bold uppercase mt-1">Create</span>
</a>
<!-- Map -->
<a class="flex flex-col items-center justify-center text-zinc-600 dark:text-zinc-400 p-2 hover:text-zinc-900 dark:hover:text-white opacity-80 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="map">map</span>
<span class="font-inter text-xs font-bold uppercase mt-1">Map</span>
</a>
</nav>
<!-- Urgent Pulse Floating Indicator -->
<div class="fixed bottom-24 right-6">
<div class="relative flex h-3 w-3">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-600 opacity-75"></span>
<span class="relative inline-flex rounded-full h-3 w-3 bg-red-600"></span>
</div>
</div>
</body></html>

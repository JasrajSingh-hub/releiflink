services:
  postgres:
    image: postgres:16
    container_name: relieflink-postgres
    environment:
      POSTGRES_DB: relieflink
      POSTGRES_USER: relieflink
      POSTGRES_PASSWORD: relieflink
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

volumes:
  pg_data: